name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-gcc-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ libhts-dev zlib1g-dev \
            samtools bedtools clang-format
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCOVIDX_BUILD_TESTS=ON \
            -DCOVIDX_BUILD_CLI=ON \
            -DCOVIDX_WERROR=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-clang-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build clang libhts-dev zlib1g-dev \
            samtools bedtools
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCOVIDX_BUILD_TESTS=ON \
            -DCOVIDX_BUILD_CLI=ON \
            -DCOVIDX_WERROR=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-gcc-asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libhts-dev zlib1g-dev
      - name: Configure
        run: |
          cmake -S . -B build-asan -G Ninja \
            -DCOVIDX_ASAN=ON \
            -DCOVIDX_UBSAN=ON \
            -DCOVIDX_BUILD_CLI=ON
      - name: Build
        run: cmake --build build-asan -j
      - name: Test
        run: ctest --test-dir build-asan --output-on-failure

  linux-clang-tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang libhts-dev zlib1g-dev
      - name: Configure
        run: |
          cmake -S . -B build-tsan -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCOVIDX_TSAN=ON \
            -DCOVIDX_BUILD_CLI=ON
      - name: Build
        run: cmake --build build-tsan -j
      - name: Test
        run: ctest --test-dir build-tsan --output-on-failure

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      - name: Check formatting
        run: |
          find include src cli tests bench \
            \( -name '*.cpp' -o -name '*.h' \) \
            ! -name 'doctest.h' -print0 \
            | xargs -0 clang-format --dry-run --Werror
